dependencies:
  # Required IDF version
  idf: ">=5.1"
  espressif/cmake_utilities:
    version: "0.*"
    rules:
      - if: "target == esp32c2"
  espressif/fb_gfx:
    version: "v61"
    path: components/fb_gfx
    git: https://github.com/Jason2866/esp32-arduino-lib-builder.git
    require: public
    rules:
      - if: "target in [esp32, esp32s2, esp32s3, esp32p4, esp32s31]"
